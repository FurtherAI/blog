<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FurtherAI</title>
  <meta name="description" content="Notes on ML systems: training infrastructure, kernels, and the occasional bin-packing problem." />
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/base.css" />
  <style>
    .posts { list-style: none; margin: 0; padding: 0; }
    .post-entry {
      display: block;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--hairline);
      text-decoration: none;
      color: inherit;
    }
    .post-entry:first-child { padding-top: 0; }
    .post-entry:hover .post-title { color: var(--accent); }
    .post-title {
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
    }
    .post-dek {
      font-family: var(--sans);
      color: var(--text-secondary);
      font-size: 0.98rem;
      margin: 0 0 0.5rem;
    }
    .post-meta {
      font-family: var(--sans);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    button[data-theme-toggle] {
      font-family: var(--sans);
      font-size: 0.8rem;
      background: none;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      color: var(--text-secondary);
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <button data-theme-toggle aria-label="Toggle dark mode">Dark</button>
      <a class="brand" href="/blog/">FurtherAI</a>
      <nav><a href="https://github.com/FurtherAI" target="_blank" rel="noopener">GitHub</a></nav>
    </header>

    <p class="dek">Technical writeups &mdash; what I'm working on, math I'm reading and research projects.</p>

    <ul class="posts">
      <li>
        <a class="post-entry" href="posts/prefix-tree-packing/">
          <p class="post-title">Prefix Tree Packing in ART</p>
          <p class="post-dek">A radix tree over a training batch and the bin-packing problem.</p>
          <p class="post-meta">2026 &middot; ART / Megatron</p>
        </a>
      </li>
    </ul>

    <footer class="site">FurtherAI</footer>
  </div>
</body>
</html>
